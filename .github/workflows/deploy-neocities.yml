name: Deploy to Neocities

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 安装 Neocities CLI
      - name: Install Neocities CLI
        run: npm install -g neocities

      # 部署
      - name: Deploy to Neocities
        run: |
          neocities upload ./*
        env:
          NEOCITIES_USERNAME: ${{ secrets.NEOCITIES_USERNAME }}
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
