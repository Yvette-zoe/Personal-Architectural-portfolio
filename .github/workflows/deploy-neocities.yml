name: Deploy to Neocities

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Deploy to Neocities
        uses: neocities/action-deploy@v1
        with:
          site: ${{ secrets.kisroyyy }}
          key: ${{ secrets.NEOCITIES_KEY }}
          dir: ./  # 如果你的网页在根目录，保持 ./ 即可
